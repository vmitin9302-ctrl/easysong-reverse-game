name: Inspect Gateway Create Operation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-gateway-operation.yml'

permissions:
  contents: write
  id-token: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: iam
        uses: docker://ghcr.io/yc-actions/yc-iam-token-fed:1.0.0
        with:
          yc-sa-id: aje91e1lh5ku368rkp2i
      - name: Inspect operation
        shell: bash
        env:
          IAM_TOKEN: ${{ steps.iam.outputs.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          echo "::add-mask::$IAM_TOKEN"
          code="$(curl -sS -o /tmp/op.json -w '%{http_code}' -H "Authorization: Bearer $IAM_TOKEN" 'https://operation.api.cloud.yandex.net/operations/d5dvq67iaoaa14s08pog')"
          jq -n --arg code "$code" --arg checked "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --slurpfile operation /tmp/op.json '{http_code:($code|tonumber),operation:$operation[0],checked_at:$checked}' >/tmp/report.json
          cat /tmp/report.json
          content="$(base64 -w0 /tmp/report.json)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/ops/gateway-operation/${GITHUB_SHA}.json" -f message="ops: inspect gateway operation ${GITHUB_SHA} [skip ci]" -f content="$content" -f branch=main >/dev/null
