name: Inspect Telegram Cloud Function

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-telegram-function.yml'

permissions:
  contents: write
  id-token: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get Yandex IAM token
        id: iam
        uses: docker://ghcr.io/yc-actions/yc-iam-token-fed:1.0.0
        with:
          yc-sa-id: aje91e1lh5ku368rkp2i

      - name: Inspect function and permissions
        shell: bash
        env:
          IAM_TOKEN: ${{ steps.iam.outputs.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          echo "::add-mask::$IAM_TOKEN"
          functions="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $IAM_TOKEN" \
            'https://serverless-functions.api.cloud.yandex.net/functions/v1/functions?folderId=b1gtc579k8imd81bb227')"
          function_id="$(printf '%s' "$functions" | jq -r '.functions[]? | select(.name=="reverse-game-telegram-webhook") | .id' | head -n1)"

          if [ -n "$function_id" ]; then
            bindings="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $IAM_TOKEN" \
              "https://serverless-functions.api.cloud.yandex.net/functions/v1/functions/${function_id}:listAccessBindings")"
            function_url="https://functions.yandexcloud.net/${function_id}"
            code="$(curl --silent --show-error --output /tmp/public-body.txt --write-out '%{http_code}' --max-time 15 "$function_url" || true)"
          else
            bindings='{"accessBindings":[]}'
            function_url=''
            code='0'
            printf 'function not found' >/tmp/public-body.txt
          fi

          jq -n \
            --arg function_id "$function_id" \
            --arg function_url "$function_url" \
            --arg public_http_code "$code" \
            --arg public_body "$(head -c 1000 /tmp/public-body.txt)" \
            --arg checked_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson bindings "$bindings" \
            '{function_found:($function_id!=""),function_id:$function_id,function_url:$function_url,access_bindings:$bindings.accessBindings,public_probe:{http_code:$public_http_code,body:$public_body},checked_at:$checked_at}' \
            >/tmp/report.json
          cat /tmp/report.json
          content="$(base64 -w0 /tmp/report.json)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/ops/telegram-function-inspect/${GITHUB_SHA}.json" \
            -f message="ops: record Telegram function inspection ${GITHUB_SHA} [skip ci]" \
            -f content="$content" -f branch=main >/dev/null
