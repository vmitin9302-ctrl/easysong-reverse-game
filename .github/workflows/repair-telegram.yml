name: Repair Telegram Bot

# Deploy a fast webhook receiver, register Telegram externally, and verify queued updates drain.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/telegram-bot/**'
      - '.github/workflows/repair-telegram.yml'

permissions:
  contents: write
  id-token: write

concurrency:
  group: reverse-game-telegram-repair
  cancel-in-progress: true

env:
  YC_SA_ID: aje91e1lh5ku368rkp2i
  YC_FOLDER_ID: b1gtc579k8imd81bb227
  YC_REGISTRY_ID: crp5evltachnf8imjg32
  YC_RUNTIME_SA_ID: aje5ib01dp5ed3v6qmgk
  YC_LOCKBOX_SECRET_ID: e6qa23qqickfuqekoojj
  YC_LOG_GROUP_ID: e23povritvkp4nnsn3pq
  BOT_CONTAINER_ID: bba5hgbd8seu96ko81bu
  PUBLIC_WEB_URL: https://easygame7-d81bb227-42b6a9.website.yandexcloud.net
  BOT_IMAGE: cr.yandex/crp5evltachnf8imjg32/reverse-game-bot:telegram-repair-${{ github.sha }}

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        uses: actions/checkout@v4

      - name: Login to Yandex Container Registry
        id: login
        uses: yc-actions/yc-cr-login@v3
        with:
          yc-sa-id: ${{ env.YC_SA_ID }}

      - name: Build and push Telegram bot image
        id: build_push
        shell: bash
        run: |
          set -Eeuo pipefail
          docker build -f apps/telegram-bot/Dockerfile -t "$BOT_IMAGE" .
          docker push "$BOT_IMAGE"

      - name: Smoke-test direct /start webhook response
        id: smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm -i "$BOT_IMAGE" python - <<'PY'
          from app import build_start_response
          payload = build_start_response(123456)
          assert payload['method'] == 'sendMessage'
          assert payload['chat_id'] == 123456
          assert 'Сможешь говорить задом наперёд?' in payload['text']
          button = payload['reply_markup']['inline_keyboard'][0][0]
          assert button['text'] == '🎮 Играть'
          assert button['web_app']['url']
          print('direct JSON webhook /start response smoke test: OK')
          PY

      - name: Deploy final Telegram bot revision
        id: deploy_final
        uses: yc-actions/yc-sls-container-deploy@v5
        with:
          yc-sa-id: ${{ env.YC_SA_ID }}
          folder-id: ${{ env.YC_FOLDER_ID }}
          container-name: reverse-game-bot
          public: true
          revision-service-account-id: ${{ env.YC_RUNTIME_SA_ID }}
          revision-cores: 1
          revision-memory: 256Mb
          revision-core-fraction: 100
          revision-concurrency: 8
          revision-image-url: ${{ env.BOT_IMAGE }}
          revision-execution-timeout: 60
          revision-log-options-log-group-id: ${{ env.YC_LOG_GROUP_ID }}
          revision-log-options-min-level: info
          revision-env: |
            TELEGRAM_WEBAPP_URL=${{ env.PUBLIC_WEB_URL }}
            TELEGRAM_WEBHOOK_URL=https://${{ env.BOT_CONTAINER_ID }}.containers.yandexcloud.net/telegram/webhook
          revision-secrets: |
            TELEGRAM_BOT_TOKEN=${{ env.YC_LOCKBOX_SECRET_ID }}/latest/TELEGRAM_BOT_TOKEN
            TELEGRAM_WEBHOOK_SECRET=${{ env.YC_LOCKBOX_SECRET_ID }}/latest/TELEGRAM_WEBHOOK_SECRET

      - name: Get Yandex Cloud IAM token via OIDC
        id: iam
        uses: docker://ghcr.io/yc-actions/yc-iam-token-fed:1.0.0
        with:
          yc-sa-id: ${{ env.YC_SA_ID }}

      - name: Register webhook externally and verify Telegram delivery
        id: verify
        shell: bash
        env:
          IAM_TOKEN: ${{ steps.iam.outputs.token }}
        run: |
          set -Eeuo pipefail
          echo "::add-mask::$IAM_TOKEN"
          bot_url="https://${BOT_CONTAINER_ID}.containers.yandexcloud.net"
          expected="$bot_url/telegram/webhook"

          # Wait for the new revision. It must start without any Telegram API call.
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 10 "$bot_url/health" > /tmp/health.json; then
              mode="$(jq -r '.registration_mode' /tmp/health.json)"
              delivery="$(jq -r '.delivery_mode' /tmp/health.json)"
              if [ "$mode" = 'external-github' ] && [ "$delivery" = 'direct-json-webhook-response' ]; then
                ready=true
                break
              fi
            fi
            sleep 3
          done
          test "$ready" = true

          payload="$(curl --fail --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $IAM_TOKEN" \
            "https://payload.lockbox.api.cloud.yandex.net/lockbox/v1/secrets/${YC_LOCKBOX_SECRET_ID}/payload")"
          BOT_TOKEN="$(printf '%s' "$payload" | jq -r '.entries[] | select(.key == "TELEGRAM_BOT_TOKEN") | .textValue')"
          WEBHOOK_SECRET="$(printf '%s' "$payload" | jq -r '.entries[] | select(.key == "TELEGRAM_WEBHOOK_SECRET") | .textValue')"
          test -n "$BOT_TOKEN"; test "$BOT_TOKEN" != null
          test -n "$WEBHOOK_SECRET"; test "$WEBHOOK_SECRET" != null
          echo "::add-mask::$BOT_TOKEN"
          echo "::add-mask::$WEBHOOK_SECRET"

          before="$(curl --fail --silent --show-error --max-time 60 \
            "https://api.telegram.org/bot${BOT_TOKEN}/getWebhookInfo")"
          before_pending="$(printf '%s' "$before" | jq -r '.result.pending_update_count')"

          registration="$(curl --fail --silent --show-error --max-time 60 -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/setWebhook" \
            --data-urlencode "url=${expected}" \
            --data-urlencode "secret_token=${WEBHOOK_SECRET}" \
            --data-urlencode 'allowed_updates=["message"]' \
            --data-urlencode 'drop_pending_updates=false')"
          printf '%s' "$registration" | jq -e '.ok == true and .result == true' >/dev/null

          delivered=false
          pending="$before_pending"
          last_error=''
          for attempt in $(seq 1 40); do
            hook="$(curl --fail --silent --show-error --max-time 60 \
              "https://api.telegram.org/bot${BOT_TOKEN}/getWebhookInfo")"
            actual="$(printf '%s' "$hook" | jq -r '.result.url')"
            pending="$(printf '%s' "$hook" | jq -r '.result.pending_update_count')"
            last_error="$(printf '%s' "$hook" | jq -r '.result.last_error_message // empty')"
            printf 'Telegram delivery check %s/40: url=%s pending=%s last_error=%q\n' "$attempt" "$actual" "$pending" "$last_error"

            test "$actual" = "$expected"
            if [ "$pending" = '0' ]; then
              delivered=true
              break
            fi
            sleep 3
          done
          test "$delivered" = true

          curl --fail --silent --show-error --max-time 20 "$bot_url/health" > /tmp/final-health.json
          jq . /tmp/final-health.json

          echo "webhook_url=$expected" >> "$GITHUB_OUTPUT"
          echo "before_pending=$before_pending" >> "$GITHUB_OUTPUT"
          echo "pending=$pending" >> "$GITHUB_OUTPUT"
          {
            echo 'last_error<<EOF'
            echo "$last_error"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Record success marker
        id: record_success
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          status_path="ops/telegram-runs/${GITHUB_SHA}.json"
          jq -n \
            --arg status success \
            --arg commit "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg bot_id "$BOT_CONTAINER_ID" \
            --arg webhook_url '${{ steps.verify.outputs.webhook_url }}' \
            --arg web_url "$PUBLIC_WEB_URL" \
            --arg before_pending '${{ steps.verify.outputs.before_pending }}' \
            --arg pending '${{ steps.verify.outputs.pending }}' \
            --arg last_error '${{ steps.verify.outputs.last_error }}' \
            --arg checked_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile health /tmp/final-health.json \
            '{status:$status,commit:$commit,run_id:$run_id,bot_id:$bot_id,bot_username:"easygame7_bot",webhook_url:$webhook_url,web_url:$web_url,delivery_mode:"direct-json-webhook-response",registration_mode:"external-github",smoke_test:"success",before_pending_updates:($before_pending|tonumber),pending_updates:($pending|tonumber),last_error:(if $last_error=="" then null else $last_error end),health:$health[0],checked_at:$checked_at}' \
            > /tmp/telegram-status.json
          content="$(base64 -w0 /tmp/telegram-status.json)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${status_path}" \
            -f message="ops: record Telegram repair success ${GITHUB_SHA} [skip ci]" \
            -f content="$content" \
            -f branch=main >/dev/null

      - name: Write failure marker
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OUT_LOGIN: ${{ steps.login.outcome }}
          OUT_BUILD_PUSH: ${{ steps.build_push.outcome }}
          OUT_SMOKE: ${{ steps.smoke.outcome }}
          OUT_DEPLOY_FINAL: ${{ steps.deploy_final.outcome }}
          OUT_IAM: ${{ steps.iam.outcome }}
          OUT_VERIFY: ${{ steps.verify.outcome }}
        run: |
          set -Eeuo pipefail
          status_path="ops/telegram-runs/${GITHUB_SHA}.json"
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg login "$OUT_LOGIN" \
            --arg build_push "$OUT_BUILD_PUSH" \
            --arg smoke "$OUT_SMOKE" \
            --arg deploy_final "$OUT_DEPLOY_FINAL" \
            --arg iam "$OUT_IAM" \
            --arg verify "$OUT_VERIFY" \
            --arg checked_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{status:"failed",commit:$commit,run_id:$run_id,steps:{login:$login,build_push:$build_push,smoke:$smoke,deploy_final:$deploy_final,iam:$iam,verify:$verify},checked_at:$checked_at}' \
            > /tmp/telegram-status.json
          content="$(base64 -w0 /tmp/telegram-status.json)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${status_path}" \
            -f message="ops: record Telegram repair failure ${GITHUB_SHA} [skip ci]" \
            -f content="$content" \
            -f branch=main >/dev/null
