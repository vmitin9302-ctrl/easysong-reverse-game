name: Repair Telegram Bot

# Self-verifying production repair for @easygame7_bot.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/telegram-bot/**'
      - '.github/workflows/repair-telegram.yml'

permissions:
  contents: write
  id-token: write

env:
  YC_SA_ID: aje91e1lh5ku368rkp2i
  YC_FOLDER_ID: b1gtc579k8imd81bb227
  YC_REGISTRY_ID: crp5evltachnf8imjg32
  YC_RUNTIME_SA_ID: aje5ib01dp5ed3v6qmgk
  YC_LOCKBOX_SECRET_ID: e6qa23qqickfuqekoojj
  YC_LOG_GROUP_ID: e23povritvkp4nnsn3pq
  PUBLIC_WEB_URL: https://easygame7-d81bb227-42b6a9.website.yandexcloud.net
  BOT_IMAGE: cr.yandex/crp5evltachnf8imjg32/reverse-game-bot:telegram-repair-${{ github.sha }}

jobs:
  repair:
    runs-on: ubuntu-latest
    outputs:
      bot_id: ${{ steps.deploy_shell.outputs.id }}
      webhook_url: ${{ steps.verify.outputs.webhook_url }}
    steps:
      - id: checkout
        uses: actions/checkout@v4

      - name: Login to Yandex Container Registry
        id: login
        uses: yc-actions/yc-cr-login@v3
        with:
          yc-sa-id: ${{ env.YC_SA_ID }}

      - name: Build and push Telegram bot image
        id: build_push
        shell: bash
        run: |
          set -Eeuo pipefail
          docker build -f apps/telegram-bot/Dockerfile -t "$BOT_IMAGE" .
          docker push "$BOT_IMAGE"

      - name: Smoke-test direct /start webhook response
        id: smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm -i "$BOT_IMAGE" python - <<'PY'
          import asyncio
          from datetime import datetime, timezone
          from aiogram.methods import SendMessage
          from aiogram.types import Chat, Message, User
          from aiogram.utils.serialization import deserialize_telegram_object_to_python
          from app import start

          message = Message(
              message_id=1,
              date=datetime.now(timezone.utc),
              chat=Chat(id=123456, type='private'),
              from_user=User(id=123456, is_bot=False, first_name='Smoke'),
              text='/start',
          )
          result = asyncio.run(start(message))
          assert isinstance(result, SendMessage)
          payload = deserialize_telegram_object_to_python(result)
          assert payload['method'] == 'sendMessage'
          assert 'Сможешь говорить задом наперёд?' in payload['text']
          button = payload['reply_markup']['inline_keyboard'][0][0]
          assert button['text'] == '🎮 Играть'
          assert button['web_app']['url']
          print('direct webhook /start response smoke test: OK')
          PY

      - name: Deploy bot shell and resolve container id
        id: deploy_shell
        uses: yc-actions/yc-sls-container-deploy@v5
        with:
          yc-sa-id: ${{ env.YC_SA_ID }}
          folder-id: ${{ env.YC_FOLDER_ID }}
          container-name: reverse-game-bot
          public: true
          revision-service-account-id: ${{ env.YC_RUNTIME_SA_ID }}
          revision-cores: 1
          revision-memory: 256Mb
          revision-core-fraction: 100
          revision-concurrency: 8
          revision-image-url: ${{ env.BOT_IMAGE }}
          revision-execution-timeout: 60
          revision-log-options-log-group-id: ${{ env.YC_LOG_GROUP_ID }}
          revision-log-options-min-level: info
          revision-env: |
            TELEGRAM_WEBAPP_URL=${{ env.PUBLIC_WEB_URL }}
          revision-secrets: |
            TELEGRAM_BOT_TOKEN=${{ env.YC_LOCKBOX_SECRET_ID }}/latest/TELEGRAM_BOT_TOKEN
            TELEGRAM_WEBHOOK_SECRET=${{ env.YC_LOCKBOX_SECRET_ID }}/latest/TELEGRAM_WEBHOOK_SECRET

      - name: Deploy final bot revision with webhook URL
        id: deploy_final
        uses: yc-actions/yc-sls-container-deploy@v5
        with:
          yc-sa-id: ${{ env.YC_SA_ID }}
          folder-id: ${{ env.YC_FOLDER_ID }}
          container-name: reverse-game-bot
          public: true
          revision-service-account-id: ${{ env.YC_RUNTIME_SA_ID }}
          revision-cores: 1
          revision-memory: 256Mb
          revision-core-fraction: 100
          revision-concurrency: 8
          revision-image-url: ${{ env.BOT_IMAGE }}
          revision-execution-timeout: 60
          revision-log-options-log-group-id: ${{ env.YC_LOG_GROUP_ID }}
          revision-log-options-min-level: info
          revision-env: |
            TELEGRAM_WEBAPP_URL=${{ env.PUBLIC_WEB_URL }}
            TELEGRAM_WEBHOOK_URL=https://${{ steps.deploy_shell.outputs.id }}.containers.yandexcloud.net/telegram/webhook
          revision-secrets: |
            TELEGRAM_BOT_TOKEN=${{ env.YC_LOCKBOX_SECRET_ID }}/latest/TELEGRAM_BOT_TOKEN
            TELEGRAM_WEBHOOK_SECRET=${{ env.YC_LOCKBOX_SECRET_ID }}/latest/TELEGRAM_WEBHOOK_SECRET

      - name: Warm and verify registered webhook
        id: verify
        shell: bash
        run: |
          set -Eeuo pipefail
          bot_url="https://${{ steps.deploy_shell.outputs.id }}.containers.yandexcloud.net"
          expected="$bot_url/telegram/webhook"

          healthy=false
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --max-time 20 "$bot_url/health" >/tmp/health.json; then
              healthy=true
              break
            fi
            sleep 5
          done
          test "$healthy" = true
          jq . /tmp/health.json

          configured="$(jq -r '.configured' /tmp/health.json)"
          registered="$(jq -r '.webhook_registered' /tmp/health.json)"
          actual="$(jq -r '.webhook_url' /tmp/health.json)"
          delivery="$(jq -r '.delivery_mode' /tmp/health.json)"

          test "$configured" = true
          test "$registered" = true
          test "$actual" = "$expected"
          test "$delivery" = 'webhook-response'

          echo "webhook_url=$actual" >> "$GITHUB_OUTPUT"
          echo 'Telegram setWebhook succeeded and /start uses direct webhook response.'

      - name: Record success marker
        id: record_success
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/status
          cat >/tmp/status/telegram-status.json <<EOF
          {
            "status": "success",
            "commit": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "bot_id": "${{ steps.deploy_shell.outputs.id }}",
            "bot_username": "easygame7_bot",
            "webhook_url": "${{ steps.verify.outputs.webhook_url }}",
            "web_url": "${PUBLIC_WEB_URL}",
            "delivery_mode": "webhook-response",
            "smoke_test": "success",
            "checked_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          content="$(base64 -w0 /tmp/status/telegram-status.json)"
          current_sha="$(gh api repos/${GITHUB_REPOSITORY}/contents/ops/telegram-status.json --jq .sha 2>/dev/null || true)"
          args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/ops/telegram-status.json" -f message='ops: record Telegram repair success [skip ci]' -f content="$content" -f branch=main)
          if [ -n "$current_sha" ]; then args+=(-f sha="$current_sha"); fi
          gh api "${args[@]}" >/dev/null

      - name: Write failure marker
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OUT_CHECKOUT: ${{ steps.checkout.outcome }}
          OUT_LOGIN: ${{ steps.login.outcome }}
          OUT_BUILD_PUSH: ${{ steps.build_push.outcome }}
          OUT_SMOKE: ${{ steps.smoke.outcome }}
          OUT_DEPLOY_SHELL: ${{ steps.deploy_shell.outcome }}
          OUT_DEPLOY_FINAL: ${{ steps.deploy_final.outcome }}
          OUT_VERIFY: ${{ steps.verify.outcome }}
        run: |
          set -Eeuo pipefail
          cat >/tmp/telegram-status.json <<EOF
          {
            "status": "failed",
            "commit": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "steps": {
              "checkout": "${OUT_CHECKOUT}",
              "login": "${OUT_LOGIN}",
              "build_push": "${OUT_BUILD_PUSH}",
              "smoke": "${OUT_SMOKE}",
              "deploy_shell": "${OUT_DEPLOY_SHELL}",
              "deploy_final": "${OUT_DEPLOY_FINAL}",
              "verify": "${OUT_VERIFY}"
            },
            "checked_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          content="$(base64 -w0 /tmp/telegram-status.json)"
          current_sha="$(gh api repos/${GITHUB_REPOSITORY}/contents/ops/telegram-status.json --jq .sha 2>/dev/null || true)"
          args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/ops/telegram-status.json" -f message='ops: record Telegram repair failure [skip ci]' -f content="$content" -f branch=main)
          if [ -n "$current_sha" ]; then args+=(-f sha="$current_sha"); fi
          gh api "${args[@]}" >/dev/null
