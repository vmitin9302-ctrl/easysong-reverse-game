name: Deploy to Yandex Cloud

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'tsconfig.base.json'
      - '.github/workflows/deploy-yandex.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: reverse-game-production
  cancel-in-progress: false

env:
  YC_SA_ID: ${{ vars.YC_SA_ID || 'aje91e1lh5ku368rkp2i' }}
  YC_FOLDER_ID: ${{ vars.YC_FOLDER_ID || 'b1gtc579k8imd81bb227' }}
  YC_REGISTRY_ID: ${{ vars.YC_REGISTRY_ID || 'crp5evltachnf8imjg32' }}
  YC_RUNTIME_SA_ID: ${{ vars.YC_RUNTIME_SA_ID || 'aje5ib01dp5ed3v6qmgk' }}
  YC_NETWORK_ID: ${{ vars.YC_NETWORK_ID || 'enpq72hh3ugdq5lon530' }}
  YC_LOCKBOX_SECRET_ID: ${{ vars.YC_LOCKBOX_SECRET_ID || 'e6qa23qqickfuqekoojj' }}
  YC_LOG_GROUP_ID: ${{ vars.YC_LOG_GROUP_ID || 'e23povritvkp4nnsn3pq' }}
  YC_WEB_BUCKET: ${{ vars.YC_WEB_BUCKET || 'easygame7-d81bb227-42b6a9' }}
  PUBLIC_WEB_URL: ${{ vars.PUBLIC_WEB_URL || 'https://easygame7-d81bb227-42b6a9.website.yandexcloud.net' }}
  OIDC_FEDERATION_ID: ${{ vars.OIDC_FEDERATION_ID || 'aje27hoijg3b8gdehibd' }}
  API_IMAGE: cr.yandex/${{ vars.YC_REGISTRY_ID || 'crp5evltachnf8imjg32' }}/reverse-game-api:${{ github.sha }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - run: pip install -r apps/api/requirements-dev.txt -r apps/telegram-bot/requirements.txt
      - run: PYTHONPATH=apps/api pytest apps/api/tests -q
      - run: PYTHONPATH=apps/telegram-bot pytest apps/telegram-bot/tests -q
      - run: python -m compileall -q apps/api/app apps/api/tests apps/telegram-bot
      - run: bash -n infra/bootstrap-yandex-cloud-shell.sh
      - run: node --check ops/qa-production-duel.mjs

  configuration:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        shell: bash
        run: |
          ready=true
          for value in \
            "$YC_SA_ID" \
            "$YC_FOLDER_ID" \
            "$YC_REGISTRY_ID" \
            "$YC_RUNTIME_SA_ID" \
            "$YC_NETWORK_ID" \
            "$YC_LOCKBOX_SECRET_ID" \
            "$YC_LOG_GROUP_ID" \
            "$YC_WEB_BUCKET" \
            "$PUBLIC_WEB_URL" \
            "$OIDC_FEDERATION_ID"; do
            if [ -z "$value" ]; then ready=false; fi
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

  api:
    needs: [configuration, quality]
    if: needs.configuration.outputs.ready == 'true'
    runs-on: ubuntu-latest
    outputs:
      api_id: ${{ steps.deploy-api.outputs.id }}
      web_url: ${{ steps.urls.outputs.web_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve public web URL
        id: urls
        shell: bash
        run: echo "web_url=$PUBLIC_WEB_URL" >> "$GITHUB_OUTPUT"

      - name: Login to Yandex Container Registry
        uses: yc-actions/yc-cr-login@v3
        with:
          yc-sa-id: ${{ env.YC_SA_ID }}

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t "$API_IMAGE" .

      - name: Push API image
        run: docker push "$API_IMAGE"

      - name: Deploy API Serverless Container
        id: deploy-api
        uses: yc-actions/yc-sls-container-deploy@v5
        with:
          yc-sa-id: ${{ env.YC_SA_ID }}
          folder-id: ${{ env.YC_FOLDER_ID }}
          container-name: reverse-game-api
          public: true
          revision-service-account-id: ${{ env.YC_RUNTIME_SA_ID }}
          revision-cores: 1
          revision-memory: 512Mb
          revision-core-fraction: 100
          revision-concurrency: 8
          revision-image-url: ${{ env.API_IMAGE }}
          revision-execution-timeout: 15
          revision-network-id: ${{ env.YC_NETWORK_ID }}
          revision-log-options-log-group-id: ${{ env.YC_LOG_GROUP_ID }}
          revision-log-options-min-level: info
          revision-env: |
            ALLOWED_ORIGINS=${{ steps.urls.outputs.web_url }}
            EASYSONG_URL=https://easysong.ru/webapp/auth?next=%2Fwebapp
            S3_ENDPOINT_URL=https://storage.yandexcloud.net
            S3_REGION=ru-central1
            AUDIO_TTL_SECONDS=1200
            INVITE_TTL_SECONDS=1800
            ANALYTICS_ADMIN_TOKEN=${{ secrets.ANALYTICS_ADMIN_TOKEN }}
            ANALYTICS_INGEST_TOKEN=${{ secrets.ANALYTICS_INGEST_TOKEN }}
          revision-secrets: |
            DATABASE_URL=${{ env.YC_LOCKBOX_SECRET_ID }}/latest/DATABASE_URL
            SESSION_SECRET=${{ env.YC_LOCKBOX_SECRET_ID }}/latest/SESSION_SECRET
            TELEGRAM_BOT_TOKEN=${{ env.YC_LOCKBOX_SECRET_ID }}/latest/TELEGRAM_BOT_TOKEN
            S3_BUCKET=${{ env.YC_LOCKBOX_SECRET_ID }}/latest/S3_BUCKET
            S3_ACCESS_KEY_ID=${{ env.YC_LOCKBOX_SECRET_ID }}/latest/S3_ACCESS_KEY_ID
            S3_SECRET_ACCESS_KEY=${{ env.YC_LOCKBOX_SECRET_ID }}/latest/S3_SECRET_ACCESS_KEY

  web:
    needs: [configuration, api]
    if: needs.configuration.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci

      - name: Resolve public API URL and build production web app
        shell: bash
        run: |
          api_url='${{ vars.PUBLIC_API_URL }}'
          if [ -z "$api_url" ]; then
            api_url='https://${{ needs.api.outputs.api_id }}.containers.yandexcloud.net'
          fi
          VITE_API_BASE_URL="$api_url" \
          VITE_EASYSONG_URL='https://easysong.ru/webapp/auth?next=%2Fwebapp' \
          VITE_TELEGRAM_BOT_URL='https://t.me/easygame7_bot' \
          npm run build

      - name: Upload web app to Yandex Object Storage
        uses: yc-actions/yc-obj-storage-upload@v4
        with:
          yc-sa-id: ${{ env.YC_SA_ID }}
          bucket: ${{ env.YC_WEB_BUCKET }}
          root: ./apps/web/dist
          include: |
            *
            **/*
          clear: true
          fail-on-error: true
          cache-control: |
            assets/**: public, max-age=31536000, immutable
            *.html: no-cache
            *: no-cache

  qa:
    needs: [configuration, api, web]
    if: needs.configuration.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run production duel smoke test
        shell: bash
        env:
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
          DEPLOYED_API_ID: ${{ needs.api.outputs.api_id }}
        run: |
          web_html="$(curl --fail --silent --show-error --retry 8 --retry-delay 3 "$PUBLIC_WEB_URL")"
          grep -q 'id="root"' <<< "$web_html"
          api_url="$PUBLIC_API_URL"
          if [ -z "$api_url" ]; then
            api_url="https://${DEPLOYED_API_ID}.containers.yandexcloud.net"
          fi
          QA_API_URL="$api_url" node ops/qa-production-duel.mjs

  summary:
    needs: [configuration, api, web, qa]
    if: needs.configuration.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deployment summary
        shell: bash
        run: |
          api_url='${{ vars.PUBLIC_API_URL }}'
          if [ -z "$api_url" ]; then
            api_url='https://${{ needs.api.outputs.api_id }}.containers.yandexcloud.net'
          fi
          echo "### Reverse Game production" >> "$GITHUB_STEP_SUMMARY"
          echo "Web: $PUBLIC_WEB_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "API: $api_url" >> "$GITHUB_STEP_SUMMARY"
          echo "Telegram: Railway long polling (managed outside Yandex deploy)" >> "$GITHUB_STEP_SUMMARY"
