name: Activate Existing Telegram Gateway

# Uses the deterministic public service domain; no ApiGatewayService.Get/List permission needed.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activate-telegram-gateway.yml'

permissions:
  contents: write
  id-token: write

concurrency:
  group: reverse-game-telegram-gateway-activation
  cancel-in-progress: true

env:
  YC_SA_ID: aje91e1lh5ku368rkp2i
  YC_LOCKBOX_SECRET_ID: e6qa23qqickfuqekoojj
  GATEWAY_ID: d5djlfnvtqd36klgs2dd
  GATEWAY_URL: https://d5djlfnvtqd36klgs2dd.apigw.yandexcloud.net/telegram/webhook
  WEB_URL: https://easygame7-d81bb227-42b6a9.website.yandexcloud.net

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get Yandex IAM token
        id: iam
        uses: docker://ghcr.io/yc-actions/yc-iam-token-fed:1.0.0
        with:
          yc-sa-id: ${{ env.YC_SA_ID }}

      - name: Load Telegram credentials from Lockbox
        id: prepare
        shell: bash
        env:
          IAM_TOKEN: ${{ steps.iam.outputs.token }}
        run: |
          set -Eeuo pipefail
          echo "::add-mask::$IAM_TOKEN"
          lockbox="$(curl --fail --silent --show-error --max-time 60 -H "Authorization: Bearer $IAM_TOKEN" "https://payload.lockbox.api.cloud.yandex.net/lockbox/v1/secrets/${YC_LOCKBOX_SECRET_ID}/payload")"
          BOT_TOKEN="$(printf '%s' "$lockbox" | jq -r '.entries[] | select(.key=="TELEGRAM_BOT_TOKEN") | .textValue')"
          WEBHOOK_SECRET="$(printf '%s' "$lockbox" | jq -r '.entries[] | select(.key=="TELEGRAM_WEBHOOK_SECRET") | .textValue')"
          test -n "$BOT_TOKEN"; test "$BOT_TOKEN" != null; test -n "$WEBHOOK_SECRET"; test "$WEBHOOK_SECRET" != null
          echo "::add-mask::$BOT_TOKEN"; echo "::add-mask::$WEBHOOK_SECRET"
          printf '%s' "$BOT_TOKEN" >/tmp/bot-token; printf '%s' "$WEBHOOK_SECRET" >/tmp/webhook-secret

      - name: Probe Gateway with synthetic /start
        id: probe
        shell: bash
        run: |
          set -Eeuo pipefail
          secret="$(cat /tmp/webhook-secret)"
          body='{"update_id":999999004,"message":{"message_id":1,"date":1787420000,"chat":{"id":123456,"type":"private"},"from":{"id":123456,"is_bot":false,"first_name":"Smoke"},"text":"/start"}}'
          ok=false
          for attempt in $(seq 1 30); do
            code="$(curl --silent --show-error --output /tmp/probe.json --write-out '%{http_code}' --max-time 20 -H 'Content-Type: application/json' -H "X-Telegram-Bot-Api-Secret-Token: $secret" -d "$body" "$GATEWAY_URL" || true)"
            echo "Gateway /start probe $attempt/30: HTTP $code"; cat /tmp/probe.json 2>/dev/null || true
            if [ "$code" = 200 ] && jq -e '.method=="sendMessage" and .chat_id==123456 and .reply_markup.inline_keyboard[0][0].text=="🎮 Играть"' /tmp/probe.json >/dev/null 2>&1; then ok=true; break; fi
            sleep 3
          done
          test "$ok" = true

      - name: Recover pending /start and activate Gateway webhook
        id: activate
        shell: bash
        run: |
          set -Eeuo pipefail
          token="$(cat /tmp/bot-token)"; secret="$(cat /tmp/webhook-secret)"
          before="$(curl --fail --silent --show-error --max-time 60 "https://api.telegram.org/bot${token}/getWebhookInfo")"
          before_url="$(printf '%s' "$before" | jq -r '.result.url')"; before_pending="$(printf '%s' "$before" | jq -r '.result.pending_update_count')"; before_error="$(printf '%s' "$before" | jq -r '.result.last_error_message // empty')"
          echo "Before activation: url=$before_url pending=$before_pending error=$before_error"

          if [ -n "$before_url" ]; then
            curl --fail --silent --show-error --max-time 60 -X POST "https://api.telegram.org/bot${token}/deleteWebhook" --data-urlencode 'drop_pending_updates=false' | jq -e '.ok==true and .result==true' >/dev/null
            sleep 2
          fi

          updates="$(curl --fail --silent --show-error --max-time 60 "https://api.telegram.org/bot${token}/getUpdates?offset=-100&limit=100&timeout=0&allowed_updates=%5B%22message%22%5D")"
          printf '%s' "$updates" >/tmp/updates.json; jq -e '.ok==true' /tmp/updates.json >/dev/null
          max_id="$(jq -r '[.result[].update_id] | if length==0 then empty else max end' /tmp/updates.json)"
          jq -r '[.result[] | select(.message.text? | strings | startswith("/start")) | .message.chat.id] | unique[]' /tmp/updates.json >/tmp/chats
          recovered=0
          while IFS= read -r chat_id; do
            [ -n "$chat_id" ] || continue
            payload="$(jq -nc --argjson c "$chat_id" --arg w "$WEB_URL" '{chat_id:$c,text:"🎙 Сможешь говорить задом наперёд?\n\nЗапиши фразу, услышь её наоборот и попробуй повторить. Посмотрим, сколько процентов ты наберёшь 😈",reply_markup:{inline_keyboard:[[{text:"🎮 Играть",web_app:{url:$w}}]]}}')"
            curl --fail --silent --show-error --max-time 60 -H 'Content-Type: application/json' -d "$payload" "https://api.telegram.org/bot${token}/sendMessage" | jq -e '.ok==true' >/dev/null
            recovered=$((recovered+1))
          done </tmp/chats
          if [ -n "$max_id" ]; then next=$((max_id+1)); curl --fail --silent --show-error --max-time 60 "https://api.telegram.org/bot${token}/getUpdates?offset=${next}&limit=1&timeout=0&allowed_updates=%5B%22message%22%5D" | jq -e '.ok==true' >/dev/null; fi

          registration="$(curl --fail --silent --show-error --max-time 60 -X POST "https://api.telegram.org/bot${token}/setWebhook" --data-urlencode "url=${GATEWAY_URL}" --data-urlencode "secret_token=${secret}" --data-urlencode 'allowed_updates=["message"]' --data-urlencode 'drop_pending_updates=true')"
          printf '%s' "$registration" | jq -e '.ok==true and .result==true' >/dev/null
          sleep 3
          final="$(curl --fail --silent --show-error --max-time 60 "https://api.telegram.org/bot${token}/getWebhookInfo")"
          actual="$(printf '%s' "$final" | jq -r '.result.url')"; pending="$(printf '%s' "$final" | jq -r '.result.pending_update_count')"; last_error="$(printf '%s' "$final" | jq -r '.result.last_error_message // empty')"
          test "$actual" = "$GATEWAY_URL"; test "$pending" = 0
          echo "before_pending=$before_pending" >> "$GITHUB_OUTPUT"; echo "recovered=$recovered" >> "$GITHUB_OUTPUT"; echo "pending=$pending" >> "$GITHUB_OUTPUT"; { echo 'last_error<<EOF'; echo "$last_error"; echo 'EOF'; } >> "$GITHUB_OUTPUT"

      - name: Record immutable activation result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARE: ${{ steps.prepare.outcome }}
          PROBE: ${{ steps.probe.outcome }}
          ACTIVATE: ${{ steps.activate.outcome }}
        run: |
          set -Eeuo pipefail
          status=failed; [ "$ACTIVATE" = success ] && status=success
          jq -n --arg status "$status" --arg commit "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" --arg prepare "$PREPARE" --arg probe "$PROBE" --arg activate "$ACTIVATE" --arg gateway_id "$GATEWAY_ID" --arg gateway_url "$GATEWAY_URL" --arg before '${{ steps.activate.outputs.before_pending }}' --arg recovered '${{ steps.activate.outputs.recovered }}' --arg pending '${{ steps.activate.outputs.pending }}' --arg last_error '${{ steps.activate.outputs.last_error }}' --arg checked "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{status:$status,commit:$commit,run_id:$run,steps:{prepare:$prepare,probe:$probe,activate:$activate},gateway_id:$gateway_id,gateway_url:$gateway_url,before_pending_updates:(if $before=="" then null else ($before|tonumber) end),recovered_start_chats:(if $recovered=="" then null else ($recovered|tonumber) end),pending_updates:(if $pending=="" then null else ($pending|tonumber) end),last_error:(if $last_error=="" then null else $last_error end),checked_at:$checked}' >/tmp/result.json
          content="$(base64 -w0 /tmp/result.json)"; path="ops/telegram-gateway-active/${GITHUB_SHA}.json"
          current="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}" --jq .sha 2>/dev/null || true)"
          args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" -f message="ops: record Telegram Gateway activation ${GITHUB_SHA} [skip ci]" -f content="$content" -f branch=main)
          if [ -n "$current" ]; then args+=(-f sha="$current"); fi
          gh api "${args[@]}" >/dev/null
