name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  browser-compatibility:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npx playwright install chromium webkit
      - name: Strict CSP and native macOS WebKit audio
        run: node ops/qa-browser-security.mjs
        env:
          QA_REQUIRE_AUDIO: 'true'
          QA_SECURITY_OUTPUT: work/security-engines.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-compatibility
          path: work/security-engines.json
          if-no-files-found: ignore

  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: reverse_game_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r apps/api/requirements-dev.txt -r apps/telegram-bot/requirements.txt
      - run: python -m compileall -q apps/api apps/telegram-bot
      - run: PYTHONPATH=apps/api pytest -q apps/api/tests
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://postgres:test-only-password@localhost:5432/reverse_game_test
      - run: PYTHONPATH=apps/telegram-bot pytest -q apps/telegram-bot/tests

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - run: bash -n ../bootstrap-yandex-cloud-shell.sh
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.5.7'
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
