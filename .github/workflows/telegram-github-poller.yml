name: Telegram GitHub Poller

# Temporary autonomous fallback until the Yandex API Gateway role is granted.
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/telegram-github-poller.yml'

permissions:
  contents: write
  id-token: write

concurrency:
  group: reverse-game-telegram-github-poller
  cancel-in-progress: false

env:
  YC_SA_ID: aje91e1lh5ku368rkp2i
  YC_LOCKBOX_SECRET_ID: e6qa23qqickfuqekoojj
  WEB_URL: https://easygame7-d81bb227-42b6a9.website.yandexcloud.net
  STATE_PATH: ops/telegram-github-poller-state.json

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - name: Get Yandex IAM token
        id: iam
        uses: docker://ghcr.io/yc-actions/yc-iam-token-fed:1.0.0
        with:
          yc-sa-id: ${{ env.YC_SA_ID }}

      - name: Poll Telegram and answer /start
        id: poll
        shell: bash
        env:
          IAM_TOKEN: ${{ steps.iam.outputs.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          echo "::add-mask::$IAM_TOKEN"
          lockbox="$(curl --fail --silent --show-error --max-time 60 -H "Authorization: Bearer $IAM_TOKEN" "https://payload.lockbox.api.cloud.yandex.net/lockbox/v1/secrets/${YC_LOCKBOX_SECRET_ID}/payload")"
          BOT_TOKEN="$(printf '%s' "$lockbox" | jq -r '.entries[] | select(.key=="TELEGRAM_BOT_TOKEN") | .textValue')"
          test -n "$BOT_TOKEN"; test "$BOT_TOKEN" != null
          echo "::add-mask::$BOT_TOKEN"

          hook="$(curl --fail --silent --show-error --max-time 60 "https://api.telegram.org/bot${BOT_TOKEN}/getWebhookInfo")"
          hook_url="$(printf '%s' "$hook" | jq -r '.result.url')"
          if [ -n "$hook_url" ]; then
            curl --fail --silent --show-error --max-time 60 -X POST "https://api.telegram.org/bot${BOT_TOKEN}/deleteWebhook" --data-urlencode 'drop_pending_updates=false' | jq -e '.ok == true' >/dev/null
            sleep 1
          fi

          state_json="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${STATE_PATH}?ref=main" --jq .content 2>/dev/null | tr -d '\n' | base64 -d 2>/dev/null || true)"
          next_offset="$(printf '%s' "$state_json" | jq -r '.next_offset // 0' 2>/dev/null || echo 0)"
          [[ "$next_offset" =~ ^[0-9]+$ ]] || next_offset=0

          if [ "$next_offset" -gt 0 ]; then query="offset=${next_offset}&limit=100&timeout=0&allowed_updates=%5B%22message%22%5D"; else query="offset=-100&limit=100&timeout=0&allowed_updates=%5B%22message%22%5D"; fi
          updates="$(curl --fail --silent --show-error --max-time 60 "https://api.telegram.org/bot${BOT_TOKEN}/getUpdates?${query}")"
          printf '%s' "$updates" >/tmp/updates.json
          jq -e '.ok == true' /tmp/updates.json >/dev/null
          count="$(jq '.result | length' /tmp/updates.json)"
          max_update="$(jq -r '[.result[].update_id] | if length == 0 then empty else max end' /tmp/updates.json)"
          jq -r '[.result[] | select(.message.text? | strings | startswith("/start")) | .message.chat.id] | unique[]' /tmp/updates.json >/tmp/start-chats

          sent=0
          while IFS= read -r chat_id; do
            [ -n "$chat_id" ] || continue
            message="$(jq -nc --argjson chat "$chat_id" --arg web "$WEB_URL" '{chat_id:$chat,text:"🎙 Сможешь говорить задом наперёд?\n\nЗапиши фразу, услышь её наоборот и попробуй повторить. Посмотрим, сколько процентов ты наберёшь 😈",reply_markup:{inline_keyboard:[[{text:"🎮 Играть",web_app:{url:$web}}]]}}')"
            curl --fail --silent --show-error --max-time 60 -H 'Content-Type: application/json' -d "$message" "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" | jq -e '.ok == true' >/dev/null
            sent=$((sent + 1))
          done </tmp/start-chats

          if [ -n "$max_update" ]; then
            next_offset=$((max_update + 1))
            curl --fail --silent --show-error --max-time 60 "https://api.telegram.org/bot${BOT_TOKEN}/getUpdates?offset=${next_offset}&limit=1&timeout=0&allowed_updates=%5B%22message%22%5D" | jq -e '.ok == true' >/dev/null
          fi

          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n --argjson next_offset "$next_offset" --argjson received "$count" --argjson start_replies "$sent" --arg checked_at "$now" '{mode:"github-polling",next_offset:$next_offset,received_updates:$received,start_replies:$start_replies,last_checked_at:$checked_at}' >/tmp/state.json
          content="$(base64 -w0 /tmp/state.json)"
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${STATE_PATH}?ref=main" --jq .sha 2>/dev/null || true)"
          args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/${STATE_PATH}" -f message='ops: update Telegram polling state [skip ci]' -f content="$content" -f branch=main)
          if [ -n "$current_sha" ]; then args+=(-f sha="$current_sha"); fi
          gh api "${args[@]}" >/dev/null

          echo "received=$count" >> "$GITHUB_OUTPUT"
          echo "sent=$sent" >> "$GITHUB_OUTPUT"
          echo "next_offset=$next_offset" >> "$GITHUB_OUTPUT"
          echo "Telegram polling cycle complete: received=$count start_replies=$sent next_offset=$next_offset"
