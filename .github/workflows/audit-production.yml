name: Audit Reverse Game production
on:
  workflow_dispatch:
    inputs:
      repair_audio_cors:
        description: Add the production game origin to its audio bucket CORS
        type: boolean
        default: false
      grant_log_reader:
        description: Grant this game deploy account reader access to its log group
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            const response = await fetch('https://auth.yandex.cloud/oauth/token', {
              method: 'POST',
              body: new URLSearchParams({ grant_type: 'urn:ietf:params:oauth:grant-type:token-exchange', requested_token_type: 'urn:ietf:params:oauth:token-type:access_token', audience: 'aje91e1lh5ku368rkp2i', subject_token: token, subject_token_type: 'urn:ietf:params:oauth:token-type:id_token' })
            });
            if (!response.ok) throw new Error(`Cloud authentication failed: ${response.status}`);
            const result = await response.json();
            core.setSecret(result.access_token);
            core.exportVariable('YC_IAM_TOKEN', result.access_token);
      - name: Install official Cloud CLI
        run: |
          curl --fail --silent --show-error https://storage.yandexcloud.net/yandexcloud-yc/install.sh -o /tmp/install-yc.sh
          bash /tmp/install-yc.sh -i /tmp/yc -n
          echo /tmp/yc/bin >> "$GITHUB_PATH"
      - name: Inspect isolated game resources and summarize logs
        env:
          REPAIR_AUDIO_CORS: ${{ inputs.repair_audio_cors }}
          GRANT_LOG_READER: ${{ inputs.grant_log_reader }}
        run: python ops/audit-cloud.py
