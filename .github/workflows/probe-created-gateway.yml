name: Probe Created Telegram Gateway

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-created-gateway.yml'

permissions:
  contents: write
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: iam
        uses: docker://ghcr.io/yc-actions/yc-iam-token-fed:1.0.0
        with:
          yc-sa-id: aje91e1lh5ku368rkp2i
      - name: Probe
        shell: bash
        env:
          IAM_TOKEN: ${{ steps.iam.outputs.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          echo "::add-mask::$IAM_TOKEN"
          lockbox="$(curl -fsS -H "Authorization: Bearer $IAM_TOKEN" 'https://payload.lockbox.api.cloud.yandex.net/lockbox/v1/secrets/e6qa23qqickfuqekoojj/payload')"
          secret="$(echo "$lockbox" | jq -r '.entries[] | select(.key=="TELEGRAM_WEBHOOK_SECRET") | .textValue')"
          echo "::add-mask::$secret"
          body='{"update_id":999999099,"message":{"message_id":1,"date":1787420000,"chat":{"id":123456,"type":"private"},"from":{"id":123456,"is_bot":false,"first_name":"Probe"},"text":"/start"}}'
          code="$(curl -sS -o /tmp/body.txt -w '%{http_code}' --max-time 30 -H 'Content-Type: application/json' -H "X-Telegram-Bot-Api-Secret-Token: $secret" -d "$body" 'https://d5djlfnvtqd36klgs2dd.apigw.yandexcloud.net/telegram/webhook' || true)"
          raw="$(head -c 4000 /tmp/body.txt 2>/dev/null || true)"
          jq -n --arg code "$code" --arg body "$raw" --arg checked "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{http_code:($code|tonumber),body:$body,checked_at:$checked}' >/tmp/report.json
          cat /tmp/report.json
          content="$(base64 -w0 /tmp/report.json)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/ops/gateway-probe/${GITHUB_SHA}.json" -f message="ops: gateway direct probe ${GITHUB_SHA} [skip ci]" -f content="$content" -f branch=main >/dev/null
