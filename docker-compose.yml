services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reverse_game
      POSTGRES_USER: reverse_game
      POSTGRES_PASSWORD: reverse_game
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reverse_game -d reverse_game"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - reverse_game_pg:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://reverse_game:reverse_game@postgres:5432/reverse_game
      ALLOWED_ORIGINS: http://localhost:5173
      SESSION_SECRET: local-development-secret
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  reverse_game_pg:
